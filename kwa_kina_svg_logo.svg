<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="100%" height="100%" class="w-full h-auto">
  <defs>
    <!-- Rare Palette Gradients -->
    <!-- Electric Amber Gold -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFBF42" />
      <stop offset="100%" stop-color="#E5A93C" />
    </linearGradient>
    
    <!-- Jade / Sage Glow -->
    <linearGradient id="jadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#124E46" />
    </linearGradient>

    <!-- Steam Vapor Gradient (Golden Amber to Soft Warm Mist) -->
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FFBF42" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#FFD685" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Midnight Plum Background Plate -->
  <rect width="520" height="140" rx="20" fill="#130A1B" stroke="#2A1638" stroke-width="2"/>

  <!-- LOGO ICON MARK -->
  <g transform="translate(25, 15)">
    <!-- Outer Mobility Speed Arc / Rim -->
    <path d="M 55 10 A 45 45 0 1 1 15 75" fill="none" stroke="url(#amberGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="180 30" filter="url(#glow)"/>
    
    <!-- Secondary Motion Arc -->
    <path d="M 22 25 A 40 40 0 0 1 80 35" fill="none" stroke="url(#jadeGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- Wheel / Mobility Hub -->
    <circle cx="55" cy="55" r="28" fill="#2A1638" stroke="url(#amberGrad)" stroke-width="3" />

    <!-- Steam Plumes Rising from Motion Wheel -->
    <path d="M 45 60 C 40 45, 52 40, 48 28 C 45 18, 55 12, 58 5" fill="none" stroke="url(#steamGrad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 58 65 C 55 52, 65 48, 62 35 C 58 25, 70 18, 72 10" fill="none" stroke="url(#steamGrad)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 38 52 C 32 42, 40 35, 36 22" fill="none" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

    <!-- Cleanliness / Sparkle Icons -->
    <!-- Sparkle 1 -->
    <path d="M 85 20 L 88 28 L 96 31 L 88 34 L 85 42 L 82 34 L 74 31 L 82 28 Z" fill="#ffffff" filter="url(#glow)"/>
    <!-- Sparkle 2 -->
    <path d="M 20 85 L 22 90 L 27 92 L 22 94 L 20 99 L 18 94 L 13 92 L 18 90 Z" fill="url(#amberGrad)"/>
    
    <!-- Droplet Center inside Wheel -->
    <path d="M 55 45 C 55 45 46 56 46 61 C 46 66 50 70 55 70 C 60 70 64 66 64 61 C 64 56 55 45 55 45 Z" fill="url(#amberGrad)"/>
  </g>

  <!-- LOGO TEXT BRAND -->
  <!-- Main Wordmark: Kwa-Kina -->
  <text x="145" y="60" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="-0.5">
    Kwa-<tspan fill="url(#amberGrad)">Kina</tspan>
  </text>
  
  <!-- Subtitle Tagline: STEAM CLEANING AND DETAILING -->
  <text x="147" y="85" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#2DD4BF" letter-spacing="2.5">
    STEAM CLEANING &amp; DETAILING
  </text>

  <!-- Mobile Service Pill Badge -->
  <g transform="translate(147, 96)">
    <rect width="190" height="20" rx="6" fill="#2A1638" stroke="#381D4A" stroke-width="1"/>
    <text x="10" y="14" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#FFBF42" letter-spacing="1">
      ⚡ 100% MOBILE ON-SITE
    </text>
  </g>
</svg>